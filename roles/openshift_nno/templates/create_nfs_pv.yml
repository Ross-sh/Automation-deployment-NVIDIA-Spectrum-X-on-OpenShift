---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: "{{ pv_name }}"
spec:
  capacity:
    storage: "{{ storage_size }}"
  accessModes:
    - "{{ access_mode }}"
  storageClassName: "{{ storage_class }}"
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: "{{ nfs_server }}"
    path: "{{ nfs_path }}"
