---
- name: Changing corepassword for troubleshooting
  hosts: localhost

  vars_files: 
    - vars/ocp_connect.yml
    - vars/core_passw.yml

  tasks:
    - name: Generate SHA-512 password hash
      ansible.builtin.set_fact:
        hashed_password: "{{ core_password | ansible.builtin.password_hash('sha512') }}"

    - name: Display the password for confirmation (Optional)
      ansible.builtin.debug:
        msg: "The newly generated password is: {{ hashed_password }}"

    - name: Deploy Core Password MachineConfig
      kubernetes.core.k8s:
        kubeconfig: "{{ k8s_kubeconfig }}"
        host: "{{ ocp_api_url }}"
        state: present
        definition:
          apiVersion: machineconfiguration.openshift.io/v1
          kind: MachineConfig
          metadata:
            labels:
              machineconfiguration.openshift.io/role: "{{ node_role }}"
            name: "set-core-user-password-{{ node_role }}"
          spec:
            config:
              ignition:
                version: 3.2.0
              passwd:
                users:
                - name: core
                  passwordHash: "{{ hashed_password }}"

